name: Update bike map

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('jsonlite', 'leaflet', 'leaflet.minicharts', 'htmlwidgets'), repos='https://cloud.r-project.org')"

      - name: Generate map
        run: Rscript update_index.R
        env:
          JCDECAUX_API_KEY: ${{ secrets.JCDECAUX_API_KEY }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update bike map [skip ci]"
          file_pattern: "docs/index.html docs/index_files/"
